name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  # Starts its own throwaway MySQL container (Docker is preinstalled on the runner).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:integration

  # Dev tooling needs Node 22+, but the published CLIs promise Node 20+.
  runtime-node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Run the built CLIs on Node 20
        run: |
          for cli in mysql-axi mysql-rw-axi; do
            node "packages/$cli/dist/$cli.js" --version
            node "packages/$cli/dist/$cli.js" --help
          done
          cd / && MYSQL_AXI_NO_KEYCHAIN=1 node "$GITHUB_WORKSPACE/packages/mysql-axi/dist/mysql-axi.js"
